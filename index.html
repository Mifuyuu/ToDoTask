<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoTask - ภารกิจประจำวัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&family=Kanit:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- แถบด้านบน: streak / XP -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">ToDo<span>Task</span></div>
      <div class="stats">
        <div class="stat streak" title="จำนวนวันติดต่อกัน"><img src="flame.svg" alt="" class="stat-icon"> <span id="streak">0</span></div>
        <div class="stat xp" title="คะแนน XP ทั้งหมด"><img src="gems.svg" alt="" class="stat-icon"> <span id="xp">0</span></div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- มาสคอต + คำพูด -->
    <section class="mascot-box">
      <img src="character.svg" class="owl" id="owl" alt="มาสคอต">
      <div class="speech" id="speech">สวัสดี! วันนี้จะทำอะไรดี?</div>
    </section>

    <!-- แถบความคืบหน้า -->
    <section class="progress-box">
      <div class="progress-label">
        <span>ความคืบหน้าวันนี้</span>
        <span id="progressText">0/0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <!-- ฟอร์มเพิ่มงาน -->
    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="เพิ่มภารกิจใหม่..." maxlength="100" autocomplete="off">
      <button type="submit" class="btn btn-green btn-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>เพิ่ม</button>
    </form>

    <!-- ปุ่มกรอง -->
    <div class="filters">
      <button class="filter active" data-filter="all">ทั้งหมด</button>
      <button class="filter" data-filter="active">ยังไม่เสร็จ</button>
      <button class="filter" data-filter="done">เสร็จแล้ว</button>
    </div>

    <!-- รายการงาน -->
    <ul class="task-list" id="taskList"></ul>
    <p class="empty" id="emptyText">ยังไม่มีภารกิจ ลองเพิ่มดูสิ! 🐻</p>

    <button class="btn btn-gray clear-btn" id="clearDone">ลบงานที่เสร็จแล้ว</button>
  </main>

  <!-- ป๊อปอัปตอนทำครบทุกงาน -->
  <div class="celebrate" id="celebrate">
    <div class="celebrate-card">
      <div class="big-emoji">🎉</div>
      <h2>เยี่ยมมาก!</h2>
      <p>ทำภารกิจครบทุกอย่างแล้ว</p>
      <button class="btn btn-green" id="closeCelebrate">ไปต่อ</button>
    </div>
  </div>

  <!-- เครดิต -->
  <footer class="footer">
    <p>สร้างโดย
    <a href="https://github.com/Mifuyuu" target="_blank" rel="noopener">
      <svg class="github-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      Mifuyuu
    </a></p>
    <p class="footer-small">มาสคอตจาก <a href="https://oneworks.cloud/avatar/" target="_blank" rel="noopener">OneWorks Avatar</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
